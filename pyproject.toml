[project]
name = "trav-ai-control-experiments"
version = "0.1.0"
description = "Repo to manage running simple AI control experiments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "control-arena>=13.5.1",
    "inspect-ai==0.3.164",
    "ipykernel>=7.1.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trav_ai_control"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]
